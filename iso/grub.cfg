# iso/grub.cfg
# GRUB2 boot menu for ZeroTrace USB

set default=0
set timeout=5

# Nice display settings
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "ZeroTrace v1.0 — Secure Data Sanitization" --class zerotrace {
    echo "Loading ZeroTrace..."
    linux   /casper/vmlinuz boot=casper quiet splash username=zerotrace hostname=zerotrace ---
    initrd  /casper/initrd
}

menuentry "ZeroTrace v1.0 — Safe Mode (no framebuffer)" --class zerotrace {
    linux   /casper/vmlinuz boot=casper nomodeset username=zerotrace hostname=zerotrace ---
    initrd  /casper/initrd
}

menuentry "Boot from first hard disk" --class hd {
    set root=(hd0)
    chainloader +1
}
